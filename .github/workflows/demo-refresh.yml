name: Refresh demo data

# The public demo is rebuilt every night at 02:00 IST (20:30 UTC). Its dates are
# relative to the seed, and a stock count older than 48 hours stops a store being
# used for routing, so a demo left alone would slowly stop working for a reviewer.
# Run it by hand ("Run workflow") to load the data after the first deploy.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the demo world
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not configured yet; skipping."
            exit 0
          fi
          # Long timeout: a sleeping free-tier server takes about a minute to wake.
          curl --fail --silent --show-error --max-time 280 \
            -X POST "$APP_URL/api/internal/demo/reset" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json"
