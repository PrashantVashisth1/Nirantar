# Local PostgreSQL for development and tests.
# Port 15433 on the host avoids any Postgres already on 5432, and the 5414-6013 range
# that Windows (Hyper-V) can reserve at boot, which blocked 5433 on the dev machine.
services:
  db:
    image: postgres:16-alpine
    container_name: nirantar-db
    environment:
      POSTGRES_USER: nirantar
      POSTGRES_PASSWORD: nirantar_local_only
      POSTGRES_DB: nirantar
    ports:
      - '15433:5432'
    volumes:
      - nirantar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nirantar -d nirantar']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nirantar-db-data:
