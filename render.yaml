# Render Blueprint for the API. Secrets are generated by Render or entered once
# in its dashboard; no value is stored here. The whole repository is checked out
# because backend uses the shared workspace, and the demo seed reads its sample
# images from frontend/public/samples.
services:
  - type: web
    name: nirantar-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    # --include=dev: NODE_ENV=production would otherwise skip the build tools.
    buildCommand: npm ci --include=dev && npm run build -w backend && npm run db:deploy -w backend
    startCommand: npm run start -w backend
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # "demo", not "production": the public reviewer demo shows the test OTP and
      # allows Reset demo. A real deployment would set this to production.
      - key: APP_ENV
        value: demo
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PRESCRIPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
